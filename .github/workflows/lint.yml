name: Validate Add-on Repository

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pyyaml -r haiphong_tide/requirements.txt -r vietlott/requirements.txt -r xsmb/requirements.txt

    - name: Check NumPy runtime
      run: |
        python -c "import numpy; version = tuple(map(int, numpy.__version__.split('.')[:2])); assert version < (2, 3), numpy.__version__; print(f'NumPy: {numpy.__version__}')"

    - name: Validate repository and add-on configuration
      run: |
        python -c "import yaml; repo=yaml.safe_load(open('repository.yaml', encoding='utf-8')); assert repo['name'] and repo['url'] and repo['maintainer']; addons=['haiphong_tide','vietlott','xsmb']; [yaml.safe_load(open(f'{addon}/config.yaml', encoding='utf-8')) for addon in addons]"

    - name: Lint Haiphong Tide add-on
      run: |
        flake8 haiphong_tide haiphong_tide/tests vietlott/src/vietlott xsmb/src/xsmb --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 haiphong_tide haiphong_tide/tests vietlott/src/vietlott xsmb/src/xsmb --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: pytest haiphong_tide/tests -v
