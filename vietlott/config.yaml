name: Vietlott Tracker
version: "0.3.3"
slug: vietlott_tracker
description: Tự lấy kết quả Vietlott, tự học, dự đoán và thông báo giải trúng cho từng bộ số
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:ticket-confirmation
panel_title: Vietlott
options:
  games:
    - power655
    - mega645
  poll_minutes: 30
  sets_per_draw: 3
  notify_persistent: true
  notify_service: ""
schema:
  games:
    - "list(power655|mega645)"
  poll_minutes: "int(5,240)"
  sets_per_draw: "int(1,10)"
  notify_persistent: bool
  notify_service: "str?"
